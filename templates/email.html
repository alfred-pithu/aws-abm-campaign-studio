<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#16191f;">
  <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;background:#ffffff;border-collapse:collapse;">
          <tr>
            <td style="background:#232f3e;color:#ffffff;padding:18px 28px;font-size:18px;letter-spacing:0.08em;font-weight:700;">
              AWS
            </td>
          </tr>
          <tr>
            <td style="height:4px;background:#ff9900;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          {% if hero_src %}
          <tr>
            <td>
              <img src="{{ hero_src }}" alt="{{ asset_alt }}" width="600" style="display:block;width:100%;height:auto;border:0;">
            </td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <h1 style="margin:0 0 16px 0;font-size:26px;line-height:1.3;color:#16191f;">{{ headline }}</h1>
              {% for paragraph in body_paragraphs %}
              <p style="margin:0 0 14px 0;font-size:16px;line-height:1.55;color:#2b303b;">{{ paragraph }}</p>
              {% endfor %}
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:22px 0 8px 0;">
                <tr>
                  <td style="background:#ff9900;border-radius:2px;">
                    <a href="https://aws.amazon.com/bedrock/" style="display:inline-block;padding:12px 20px;color:#16191f;text-decoration:none;font-weight:700;font-size:15px;">
                      {{ cta_text }}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px 28px;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;">
              This is a POC preview. Not a customer send.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
